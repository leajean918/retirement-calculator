<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>퇴직금 계산기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: #f0f4f8;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 16px;
  }

  .container {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.10);
    width: 100%;
    max-width: 460px;
    padding: 36px 32px 32px;
  }

  h1 {
    text-align: center;
    font-size: 22px;
    color: #1a1a2e;
    margin-bottom: 6px;
  }

  .subtitle {
    text-align: center;
    font-size: 13px;
    color: #888;
    margin-bottom: 28px;
  }

  /* 탭 선택 */
  .tab-wrap {
    display: flex;
    border: 1.5px solid #d0d7e2;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 28px;
  }

  .tab-btn {
    flex: 1;
    padding: 11px 0;
    font-size: 13px;
    font-weight: bold;
    border: none;
    background: #fff;
    color: #888;
    cursor: pointer;
    transition: all 0.2s;
    line-height: 1.4;
  }

  .tab-btn.active {
    background: #0078d7;
    color: #fff;
  }

  .tab-btn:first-child { border-right: 1.5px solid #d0d7e2; }

  /* 패널 */
  .panel { display: none; }
  .panel.active { display: block; }

  /* 입력 */
  .input-group { margin-bottom: 16px; }

  label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    color: #444;
    margin-bottom: 6px;
  }

  input {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid #d0d7e2;
    border-radius: 10px;
    font-size: 15px;
    color: #222;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus { border-color: #0078d7; }

  .row2 { display: flex; gap: 12px; }
  .row2 .input-group { flex: 1; }

  /* 결과 */
  .result-box {
    margin-top: 22px;
    background: linear-gradient(135deg, #e8f4ff, #f0faff);
    border: 1.5px solid #b3d9f7;
    border-radius: 14px;
    padding: 20px;
    text-align: center;
  }

  .result-label {
    font-size: 13px;
    color: #555;
    margin-bottom: 8px;
  }

  .result-amount {
    font-size: 32px;
    font-weight: bold;
    color: #0062b8;
    letter-spacing: -1px;
  }

  .result-detail {
    font-size: 12px;
    color: #777;
    margin-top: 10px;
    line-height: 1.7;
  }

  /* 구분선 */
  .divider {
    border: none;
    border-top: 1px dashed #e0e0e0;
    margin: 20px 0;
  }

  .notice {
    font-size: 12px;
    color: #aaa;
    line-height: 1.7;
    text-align: center;
    margin-top: 20px;
  }
</style>
</head>
<body>

<div class="container">
  <h1>💰 퇴직금 계산기</h1>
  <p class="subtitle">간편하게 예상 퇴직금을 확인해보세요</p>

  <!-- 탭 선택 -->
  <div class="tab-wrap">
    <button class="tab-btn active" onclick="switchTab('date')">
      📅 입사일·퇴사일로<br>계산하기
    </button>
    <button class="tab-btn" onclick="switchTab('simple')">
      💵 월급여·근속연수로<br>계산하기
    </button>
  </div>

  <!-- 패널 1: 입사일/퇴사일 -->
  <div class="panel active" id="panel-date">
    <div class="input-group">
      <label for="salary1">월급여 (세전, 원)</label>
      <input type="number" id="salary1" placeholder="예: 3500000" oninput="calcDate()">
    </div>
    <div class="row2">
      <div class="input-group">
        <label for="startDate">입사일</label>
        <input type="date" id="startDate" oninput="calcDate()">
      </div>
      <div class="input-group">
        <label for="endDate">퇴사일</label>
        <input type="date" id="endDate" oninput="calcDate()">
      </div>
    </div>

    <div class="result-box">
      <div class="result-label">예상 퇴직금</div>
      <div class="result-amount" id="result-date">— 원</div>
      <div class="result-detail" id="detail-date">입사일과 퇴사일을 입력하세요</div>
    </div>
  </div>

  <!-- 패널 2: 월급여 × 근속연수 -->
  <div class="panel" id="panel-simple">
    <div class="input-group">
      <label for="salary2">월급여 (세전, 원)</label>
      <input type="number" id="salary2" placeholder="예: 3500000" oninput="calcSimple()">
    </div>
    <div class="input-group">
      <label for="months">근속 개월 수</label>
      <input type="number" id="months" placeholder="예: 36 (3년 = 36개월)" oninput="calcSimple()">
    </div>

    <div class="result-box">
      <div class="result-label">예상 퇴직금</div>
      <div class="result-amount" id="result-simple">— 원</div>
      <div class="result-detail" id="detail-simple">월급여와 근속 개월 수를 입력하세요</div>
    </div>
  </div>

  <p class="notice">
    ※ 본 계산기는 간편 계산용으로, 실제 퇴직금과 차이가 있을 수 있습니다.<br>
    정확한 금액은 고용노동부 퇴직금 계산기를 이용하세요.
  </p>
</div>

<script>
  function switchTab(type) {
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
      b.classList.toggle('active', (type === 'date' && i === 0) || (type === 'simple' && i === 1));
    });
    document.getElementById('panel-date').classList.toggle('active', type === 'date');
    document.getElementById('panel-simple').classList.toggle('active', type === 'simple');
  }

  function fmt(n) {
    return Math.round(n).toLocaleString('ko-KR') + ' 원';
  }

  // 패널 1: 입사일·퇴사일 계산
  function calcDate() {
    const salary = parseFloat(document.getElementById('salary1').value) || 0;
    const start = document.getElementById('startDate').value;
    const end = document.getElementById('endDate').value;

    if (!salary || !start || !end) {
      document.getElementById('result-date').textContent = '— 원';
      document.getElementById('detail-date').textContent = '모든 항목을 입력하세요';
      return;
    }

    const startD = new Date(start);
    const endD = new Date(end);
    const diffMs = endD - startD;

    if (diffMs <= 0) {
      document.getElementById('result-date').textContent = '— 원';
      document.getElementById('detail-date').textContent = '퇴사일이 입사일보다 빠릅니다';
      return;
    }

    const totalDays = diffMs / (1000 * 60 * 60 * 24);
    const years = totalDays / 365;

    // 1년 미만이면 퇴직금 없음
    if (years < 1) {
      document.getElementById('result-date').textContent = '0 원';
      document.getElementById('detail-date').textContent = `근속기간 ${Math.floor(totalDays)}일 — 1년 미만은 퇴직금이 발생하지 않습니다`;
      return;
    }

    // 퇴직금 = 월급여 × 근속연수 (간편 계산)
    const pay = salary * years;

    const y = Math.floor(years);
    const m = Math.floor((years - y) * 12);

    document.getElementById('result-date').textContent = fmt(pay);
    document.getElementById('detail-date').textContent =
      `근속기간 ${y}년 ${m}개월 (${Math.floor(totalDays)}일)\n월급여 ${salary.toLocaleString('ko-KR')}원 × ${years.toFixed(2)}년`;
  }

  // 패널 2: 월급여 × 근속 개월 수 계산
  function calcSimple() {
    const salary = parseFloat(document.getElementById('salary2').value) || 0;
    const months = parseFloat(document.getElementById('months').value) || 0;

    if (!salary || !months) {
      document.getElementById('result-simple').textContent = '— 원';
      document.getElementById('detail-simple').textContent = '월급여와 근속 개월 수를 입력하세요';
      return;
    }

    if (months < 12) {
      document.getElementById('result-simple').textContent = '0 원';
      document.getElementById('detail-simple').textContent = '근속 12개월 미만은 퇴직금이 발생하지 않습니다';
      return;
    }

    const years = months / 12;
    const pay = salary * years;

    document.getElementById('result-simple').textContent = fmt(pay);
    document.getElementById('detail-simple').textContent =
      `월급여 ${salary.toLocaleString('ko-KR')}원 × ${years.toFixed(2)}년 (${months}개월)`;
  }
</script>
</body>
</html>
